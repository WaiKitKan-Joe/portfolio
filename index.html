<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Wai Kit Kan's finance and quantitative project portfolio, featuring quantitative finance, fixed-income forecasting, derivative valuation, risk analysis and Python projects."
    >

    <title>Wai Kit Kan | Finance Project Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 75px;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background-color: #f4f6f8;
            color: #1f2937;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Navigation */

        nav {
            background-color: #0f172a;
            padding: 16px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 1000;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .nav-name {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links a {
            color: #dbeafe;
            font-size: 15px;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        /* Hero */

        .hero {
            background:
                linear-gradient(
                    135deg,
                    #0f172a 0%,
                    #1e3a8a 65%,
                    #2563eb 100%
                );

            color: #ffffff;
            padding: 90px 0;
        }

        .hero-content {
            max-width: 850px;
        }

        .hero-label {
            display: inline-block;

            background-color:
                rgba(255, 255, 255, 0.14);

            color: #dbeafe;

            padding: 7px 14px;
            border-radius: 20px;

            font-size: 14px;
            font-weight: 600;

            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 48px;
            line-height: 1.15;
            margin-bottom: 18px;
        }

        .hero h2 {
            color: #bfdbfe;
            font-size: 23px;
            font-weight: 500;
            margin-bottom: 22px;
        }

        .hero-description {
            max-width: 780px;
            color: #e2e8f0;
            font-size: 18px;
            margin-bottom: 32px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        /* Buttons */

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 46px;
            padding: 11px 18px;

            border-radius: 7px;
            border: 1px solid transparent;

            font-size: 15px;
            font-weight: 600;

            transition:
                transform 0.2s,
                background-color 0.2s,
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 5px 12px rgba(15, 23, 42, 0.15);
        }

        .button-primary {
            background-color: #ffffff;
            color: #1d4ed8;
        }

        .button-primary:hover {
            background-color: #eff6ff;
        }

        .button-secondary {
            border-color: #93c5fd;
            color: #ffffff;
            background-color: transparent;
        }

        .button-secondary:hover {
            background-color:
                rgba(255, 255, 255, 0.1);
        }

        .button-report {
            background-color: #ffffff;
            color: #1d4ed8;
            border-color: #2563eb;
        }

        .button-report:hover {
            background-color: #eff6ff;
        }

        .button-code {
            background-color: #2563eb;
            color: #ffffff;
        }

        .button-code:hover {
            background-color: #1d4ed8;
        }

        .button-folder {
            background-color: #111827;
            color: #ffffff;
        }

        .button-folder:hover {
            background-color: #374151;
        }

        /* General sections */

        section {
            padding: 70px 0;
        }

        .section-heading {
            margin-bottom: 34px;
        }

        .section-heading h2 {
            color: #0f172a;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .section-heading p {
            color: #64748b;
            font-size: 17px;
        }

        /* About */

        .about {
            background-color: #ffffff;
        }

        .about-content {
            display: grid;

            grid-template-columns:
                minmax(0, 2fr)
                minmax(260px, 1fr);

            gap: 45px;
            align-items: start;
        }

        .about-text p {
            color: #475569;
            font-size: 17px;
            margin-bottom: 16px;
        }

        .skills-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 24px;
        }

        .skills-box h3 {
            color: #0f172a;
            margin-bottom: 16px;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .skill {
            background-color: #dbeafe;
            color: #1e40af;

            padding: 7px 11px;
            border-radius: 16px;

            font-size: 13px;
            font-weight: 600;
        }

        /* Projects */

        .projects {
            background-color: #f4f6f8;
        }

        .project-grid {
            display: grid;
            gap: 34px;
        }

        .project-card {
            background-color: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 6px 22px rgba(15, 23, 42, 0.08);

            transition:
                transform 0.25s,
                box-shadow 0.25s;
        }

        .project-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 12px 30px rgba(15, 23, 42, 0.13);
        }

        .project-header {
            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #7f1d1d
                );

            color: #ffffff;
            padding: 34px;
        }

        .project-header.treasury {
            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1d4ed8
                );
        }

        .project-header.goog {
            background:
                linear-gradient(
                    135deg,
                    #14532d,
                    #16a34a
                );
        }

        .project-type {
            display: inline-block;

            background-color:
                rgba(255, 255, 255, 0.15);

            padding: 6px 11px;
            border-radius: 15px;

            font-size: 13px;
            font-weight: 600;

            margin-bottom: 15px;
        }

        .project-header h3 {
            font-size: 27px;
            margin-bottom: 10px;
        }

        .project-header p {
            color: #dbeafe;
            font-size: 16px;
        }

        .project-body {
            padding: 32px;
        }

        .project-summary {
            color: #475569;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .project-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            margin-bottom: 26px;
        }

        .project-column h4 {
            color: #0f172a;
            font-size: 17px;
            margin-bottom: 12px;
        }

        .project-column ul {
            padding-left: 20px;
            color: #475569;
        }

        .project-column li {
            margin-bottom: 9px;
        }

        .technology-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 26px;
        }

        .technology {
            background-color: #f1f5f9;
            color: #334155;

            border: 1px solid #cbd5e1;
            border-radius: 5px;

            padding: 6px 10px;

            font-size: 13px;
            font-weight: 600;
        }

        /* Project resources */

        .project-resources {
            border-top: 1px solid #e2e8f0;
            padding-top: 22px;
        }

        .project-resources h4 {
            color: #0f172a;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .resource-description {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .project-buttons {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(150px, 1fr));

            gap: 12px;
        }

        /* Contact */

        .contact {
            background-color: #ffffff;
            text-align: center;
        }

        .contact-content {
            max-width: 700px;
            margin: 0 auto;
        }

        .contact-content h2 {
            color: #0f172a;
            font-size: 32px;
            margin-bottom: 14px;
        }

        .contact-content p {
            color: #64748b;
            font-size: 17px;
            margin-bottom: 25px;
        }

        /* Footer */

        footer {
            background-color: #0f172a;
            color: #cbd5e1;

            text-align: center;
            padding: 25px;

            font-size: 14px;
        }

        /* Tablet */

        @media (max-width: 768px) {
            nav {
                padding: 14px 5%;
            }

            .nav-links {
                gap: 13px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .hero {
                padding: 65px 0;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero h2 {
                font-size: 20px;
            }

            .about-content,
            .project-columns {
                grid-template-columns: 1fr;
            }

            .project-buttons {
                grid-template-columns: 1fr;
            }

            .project-columns {
                gap: 22px;
            }
        }

        /* Mobile */

        @media (max-width: 520px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }

            .nav-name {
                font-size: 17px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1 {
                font-size: 31px;
            }

            .hero-description {
                font-size: 16px;
            }

            .project-header,
            .project-body {
                padding: 24px;
            }

            .button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

        </div>
    </nav>
